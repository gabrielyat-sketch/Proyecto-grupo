    <!--
      El icono de la pestana. Sin esto el navegador pone su globo por defecto, y
      con varias pestanas abiertas el sistema del CAP no se distingue de
      cualquier otra pagina.

      Dos tamanos: el de 32 esta reescalado con cuidado para que el brote no se
      convierta en una mancha a 16 px, y el de 180 es el que usa iOS cuando se
      guarda el panel en la pantalla de inicio de una tableta.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/logo-cap.png" />
    <link rel="apple-touch-icon" href="/icono-tactil.png" />
    <meta name="theme-color" content="#15607a" />
    <title>CAP Purulha</title>
  </head>
