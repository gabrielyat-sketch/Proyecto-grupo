# Cabeceras que se le pasan a cada microservicio.
#
# X-Forwarded-For es la que los servicios leen como IP del usuario (tienen
# `trust proxy` en produccion); sin ella todo intento de acceso y toda sesion
# quedarian registrados con la IP del gateway.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";
# Marca lo que viene de Internet. En produccion los servicios exigen el
# cifrado de transporte solo a lo que trae esta marca (transporte.ts en
# @cap/shared); las llamadas entre servicios no pasan por aqui. La pone
# siempre nginx, asi que el navegador no puede quitarla.
proxy_set_header X-Sicap-Externo   1;
proxy_read_timeout 60s;
proxy_connect_timeout 5s;

# Que un servicio caido se vea como 502 limpio y no como un cuelgue.
proxy_next_upstream error timeout;
