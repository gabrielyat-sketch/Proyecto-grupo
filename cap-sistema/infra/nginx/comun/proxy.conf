# Cabeceras que se le pasan a cada microservicio.
#
# X-Forwarded-For es la que los servicios leen como IP del usuario (tienen
# `trust proxy` en produccion); sin ella todo intento de acceso y toda sesion
# quedarian registrados con la IP del gateway.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";
proxy_read_timeout 60s;
proxy_connect_timeout 5s;

# Que un servicio caido se vea como 502 limpio y no como un cuelgue.
proxy_next_upstream error timeout;
