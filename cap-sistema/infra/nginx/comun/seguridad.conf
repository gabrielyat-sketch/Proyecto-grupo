# Cabeceras de seguridad para todo lo que sale por el gateway.
#
# Se incluye en el bloque server Y en cada location que use add_header: en
# nginx, un add_header dentro de un location descarta los heredados del
# server, asi que sin repetirlas ahi se perderian justo en las respuestas
# del panel.
#
# `always` para que salgan tambien en las respuestas de error.

# Un ano de HTTPS obligatorio. Se activa solo con certificado real: con el
# autofirmado de pruebas el navegador la ignora.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Politica de contenido. El panel no carga NADA de fuera (fuentes, iconos y
# librerias van en el bundle), asi que todo es 'self' salvo:
#   - style-src 'unsafe-inline': MUI/emotion inyecta los estilos en linea.
#   - img-src data: blob:: los QR de MFA se generan como data URL.
# Es la red de seguridad de los tokens, que viven solo en memoria: un XSS
# futuro no podria mandarlos a otro origen (connect-src 'self').
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
