# Cabeceras de seguridad para todo lo que sale por el gateway.
#
# Se incluye en el bloque server Y en cada location que use add_header: en
# nginx, un add_header dentro de un location descarta los heredados del
# server, asi que sin repetirlas ahi se perderian justo en las respuestas
# del panel.
#
# `always` para que salgan tambien en las respuestas de error.

# Un ano de HTTPS obligatorio. Se activa solo con certificado real: con el
# autofirmado de pruebas el navegador la ignora.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), midi=(), interest-cohort=()" always;

# ─────────────────────────────────────────────────────────────────────────
#  AISLAMIENTO ENTRE ORIGENES
# ─────────────────────────────────────────────────────────────────────────
# X-Frame-Options y `frame-ancestors` impiden que nos metan en un iframe.
# Esto cubre el camino contrario y el lateral:
#
#   COOP  corta el vinculo con la ventana que nos abrio. Sin ella, una pagina
#         que abra el panel con window.open conserva una referencia viva a el.
#   CORP  impide que otro sitio incruste nuestras respuestas como recurso
#         (una imagen, un script). Todo lo que servimos es del propio panel.
#
# COEP (require-corp) se deja fuera a proposito: obliga a que CADA subrecurso
# declare permiso, y el unico beneficio real que traeria —SharedArrayBuffer y
# los temporizadores de alta precision— no lo usa nada aqui. Activarla seria
# asumir un riesgo de rotura a cambio de nada.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Para los lectores de Flash/PDF antiguos que todavia buscan un crossdomain.xml.
add_header X-Permitted-Cross-Domain-Policies "none" always;

# ─────────────────────────────────────────────────────────────────────────
#  POLITICA DE CONTENIDO
# ─────────────────────────────────────────────────────────────────────────
# El panel no carga NADA de fuera (fuentes, iconos y librerias van en el
# bundle), asi que todo es 'self'. Las dos excepciones, y por que:
#
#   - style-src 'unsafe-inline': MUI/emotion inyecta los estilos en linea en
#     tiempo de ejecucion. Quitarlo exige servir un nonce por respuesta y que
#     emotion lo use; es la mejora pendiente de esta cabecera, no un descuido.
#     Mientras tanto vale la pena recordar que un XSS por estilo no puede
#     exfiltrar: lo que protege los tokens es `connect-src 'self'`.
#   - img-src data: blob:: los QR del segundo factor se generan como data URL.
#
# Lo que se anadio: frame-src, worker-src, manifest-src y media-src. Sin ellas
# caian en `default-src`, que ya era 'self' —asi que no habia agujero— pero
# declararlas explicitas deja la politica legible y evita que un cambio futuro
# en default-src las afloje sin que nadie se de cuenta.
#
# `upgrade-insecure-requests` es cinturon y tirantes junto a HSTS: si algun dia
# se cuela una URL http:// en el bundle, el navegador la sube a https en vez de
# bloquearla y romper la pantalla.
#
# Es la red de seguridad de los tokens, que viven solo en memoria: un XSS
# futuro no podria mandarlos a otro origen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
