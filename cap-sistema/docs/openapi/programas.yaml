  description: >-
    Contrato del servicio programas.


    Generado desde el codigo. No editar a mano: los cambios se pierden en la
    siguiente exportacion. Fuente de verdad: arquitectura-cap-purulha.md
  version: "1.0"
  contact: {}
tags: []
servers:
  - url: http://localhost:3003
    description: Desarrollo local
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SaludVivoDto:
      type: object
      properties:
        estado:
          type: string
          enum:
            - vivo
          example: vivo
        fecha:
          type: string
          format: date-time
      required:
        - estado
        - fecha
    SaludListoDto:
      type: object
      properties:
        estado:
          type: string
          enum:
            - listo
          example: listo
        baseDatos:
          type: string
          description: "'ok' cuando la base responde. Si no, el endpoint devuelve 503 en
            vez de este cuerpo."
          example: ok
      required:
        - estado
        - baseDatos
    PaginaDto:
      type: object
      properties:
        pagina:
          type: number
          description: Pagina devuelta, empezando en 1.
          example: 1
        tamano:
          type: number
          description: Registros por pagina. El servidor recorta cualquier valor mayor al
            maximo.
          maximum: 100
          example: 25
        total:
          type: number
          description: Total de registros que cumplen el filtro.
          example: 137
        totalPaginas:
          type: number
          description: Total de paginas. Nunca es menor que 1.
          example: 6
      required:
        - pagina
        - tamano
        - total
        - totalPaginas
    UltimoControlHipertensionDto:
      type: object
      properties:
        fecha:
          format: date-time
          type: string
        sistolica:
          type: number
          example: 148
        diastolica:
          type: number
          example: 94
        clasificacion:
          type: string
          enum: &a7
            - NORMAL
            - ELEVADA
            - ESTADIO_1
            - ESTADIO_2
            - CRISIS
          description: Calculada a partir de las cifras, nunca tecleada.
        enMeta:
          type: boolean
          description: true si la lectura alcanza la meta acordada.
        proximoControl:
          type: string
          format: date-time
          nullable: true
      required:
        - fecha
        - sistolica
        - diastolica
        - clasificacion
        - enMeta
        - proximoControl
    ProgramaHipertensionResumenDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pacienteId:
          type: string
          format: uuid
        comunidadId:
          type: string
          format: uuid
        fechaIngreso:
          format: date-time
          type: string
        estado:
          type: string
          enum: &a6
            - ACTIVO
            - EGRESADO
            - ABANDONO
            - FALLECIDO
            - TRASLADADO
        metaSistolica:
          type: number
          example: 140
        metaDiastolica:
          type: number
          example: 90
        ultimoControl:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/UltimoControlHipertensionDto"
      required:
        - id
        - pacienteId
        - comunidadId
        - fechaIngreso
        - estado
        - metaSistolica
        - metaDiastolica
        - ultimoControl
    HipertensoAtrasadoDto:
      type: object
      properties:
        programaId:
          type: string
          format: uuid
        pacienteId:
          type: string
          format: uuid
        comunidadId:
          type: string
          format: uuid
        proximoControl:
          format: date-time
          type: string
        diasDeAtraso:
          type: number
          description: Dias transcurridos desde la fecha en que debio venir.
          example: 23
      required:
        - programaId
        - pacienteId
        - comunidadId
        - proximoControl
        - diasDeAtraso
    ProgramaHipertensionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pacienteId:
          type: string
          format: uuid
          description: Paciente del servicio usuarios. No es llave foranea.
        comunidadId:
          type: string
          format: uuid
        fechaIngreso:
          format: date-time
          type: string
        estado:
          type: string
          enum: *a6
        fechaEgreso:
          type: string
          format: date-time
          nullable: true
        motivoEgreso:
          type: string
          nullable: true
          maxLength: 200
        metaSistolica:
          type: number
          description: Meta acordada con el paciente, no un valor fijo del sistema.
          example: 140
        metaDiastolica:
          type: number
          example: 90
        inscritoPor:
          type: string
          format: uuid
        creadoEn:
          format: date-time
          type: string
      required:
        - id
        - pacienteId
        - comunidadId
        - fechaIngreso
        - estado
        - fechaEgreso
        - motivoEgreso
        - metaSistolica
        - metaDiastolica
        - inscritoPor
        - creadoEn
    InscribirHipertensionDto:
      type: object
      properties:
        pacienteId:
          type: string
          description: Identificador del paciente en el servicio de usuarios
        metaSistolica:
          type: number
          default: 140
          description: Meta de presion sistolica acordada
        metaDiastolica:
          type: number
          default: 90
      required:
        - pacienteId
    ControlHipertensionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        programaId:
          type: string
          format: uuid
        fecha:
          format: date-time
          type: string
        sistolica:
          type: number
          example: 148
        diastolica:
          type: number
          example: 94
        clasificacion:
          type: string
          enum: *a7
        enMeta:
          type: boolean
        pesoKg:
          type: string
          format: decimal
          nullable: true
          example: "72.50"
        adherencia:
          type: boolean
          nullable: true
          description: Si el paciente refiere tomar el tratamiento.
        proximoControl:
          type: string
          format: date-time
          nullable: true
          description: Calculado segun la clasificacion.
        registradoPor:
          type: string
          format: uuid
        observaciones:
          type: string
          nullable: true
          description: Descifradas. En la base son ilegibles.
      required:
        - id
        - programaId
        - fecha
        - sistolica
        - diastolica
        - clasificacion
        - enMeta
        - pesoKg
        - adherencia
        - proximoControl
        - registradoPor
        - observaciones
    RegistrarControlHipertensionDto:
      type: object
      properties:
        sistolica:
          type: number
          example: 148
          minimum: 50
          maximum: 300
        diastolica:
          type: number
          example: 94
          minimum: 30
          maximum: 200
        pesoKg:
          type: number
          minimum: 20
          maximum: 400
        adherencia:
          type: boolean
          description: Si el paciente refiere estar tomando el tratamiento
        observaciones:
          type: string
        fecha:
          format: date-time
          type: string
          description: Fecha real del control. Se usa al digitalizar papel.
      required:
        - sistolica
        - diastolica
    UltimoControlPrenatalDto:
      type: object
      properties:
        fecha:
          format: date-time
          type: string
        semanasGestacion:
          type: number
          example: 24
        proximoControl:
          type: string
          format: date-time
          nullable: true
        alertas:
          description: Senales de alarma detectadas por el sistema.
          type: array
          items:
            type: string
      required:
        - fecha
        - semanasGestacion
        - proximoControl
        - alertas
    ProgramaEmbarazoResumenDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pacienteId:
          type: string
          format: uuid
        comunidadId:
          type: string
          format: uuid
        fum:
          format: date-time
          type: string
        fpp:
          format: date-time
          type: string
        riesgo:
          type: string
          enum:
            - BAJO
            - ALTO
        motivoRiesgo:
          type: string
          nullable: true
        estado:
          type: string
          enum: &a8
            - ACTIVO
            - EGRESADO
            - ABANDONO
            - FALLECIDO
            - TRASLADADO
        numeroGestacion:
          type: number
          example: 3
        semanasGestacion:
          type: number
          example: 24
        ultimoControl:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/UltimoControlPrenatalDto"
      required:
        - id
        - pacienteId
        - comunidadId
        - fum
        - fpp
        - riesgo
        - motivoRiesgo
        - estado
        - numeroGestacion
        - semanasGestacion
        - ultimoControl
    ProgramaEmbarazoDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pacienteId:
          type: string
          format: uuid
        comunidadId:
          type: string
          format: uuid
        fum:
          format: date-time
          type: string
          description: Fecha de ultima menstruacion.
        fpp:
          format: date-time
          type: string
          description: "Fecha probable de parto: FUM + 280 dias (regla de Naegele)."
        numeroGestacion:
          type: number
          example: 3
        partosPrevios:
          type: number
          example: 2
        riesgo:
          type: string
          enum: &a9
            - BAJO
            - ALTO
        motivoRiesgo:
          type: string
          nullable: true
          maxLength: 300
          description: Por que se clasifico como alto riesgo, para que el siguiente turno
            sepa a que atenerse.
        estado:
          type: string
          enum: *a8
        resultado:
          type: string
          enum: &a10
            - PARTO_NORMAL
            - CESAREA
            - ABORTO
            - OBITO
            - TRASLADO
            - OTRO
          nullable: true
        fechaCierre:
          type: string
          format: date-time
          nullable: true
        inscritoPor:
          type: string
          format: uuid
        creadoEn:
          format: date-time
          type: string
        semanasGestacion:
          type: number
          description: Calculada al responder sobre el dia local, no almacenada.
          example: 24
      required:
        - id
        - pacienteId
        - comunidadId
        - fum
        - fpp
        - numeroGestacion
        - partosPrevios
        - riesgo
        - motivoRiesgo
        - estado
        - resultado
        - fechaCierre
        - inscritoPor
        - creadoEn
        - semanasGestacion
    InscribirEmbarazoDto:
      type: object
      properties:
        pacienteId:
          type: string
        fum:
          format: date-time
          type: string
          example: 2026-01-15
          description: Fecha de ultima menstruacion. De aqui salen la FPP y las semanas de
            gestacion.
        numeroGestacion:
          type: number
          default: 1
          minimum: 1
        partosPrevios:
          type: number
          default: 0
      required:
        - pacienteId
        - fum
    EmbarazoInscritoDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pacienteId:
          type: string
          format: uuid
        comunidadId:
          type: string
          format: uuid
        fum:
          format: date-time
          type: string
          description: Fecha de ultima menstruacion.
        fpp:
          format: date-time
          type: string
          description: "Fecha probable de parto: FUM + 280 dias (regla de Naegele)."
        numeroGestacion:
          type: number
          example: 3
        partosPrevios:
          type: number
          example: 2
        riesgo:
          type: string
          enum: *a9
        motivoRiesgo:
          type: string
          nullable: true
          maxLength: 300
          description: Por que se clasifico como alto riesgo, para que el siguiente turno
            sepa a que atenerse.
        estado:
          type: string
          enum: *a8
        resultado:
          type: string
          enum: *a10
          nullable: true
        fechaCierre:
          type: string
          format: date-time
          nullable: true
        inscritoPor:
          type: string
          format: uuid
        creadoEn:
          format: date-time
          type: string
        semanasGestacion:
          type: number
          description: Calculada al responder sobre el dia local, no almacenada.
          example: 24
        motivosRiesgo:
          description: Vacio cuando el riesgo es bajo.
          example:
            - Edad menor de 18 anios
          type: array
          items:
            type: string
      required:
        - id
        - pacienteId
        - comunidadId
        - fum
        - fpp
        - numeroGestacion
        - partosPrevios
        - riesgo
        - motivoRiesgo
        - estado
        - resultado
        - fechaCierre
        - inscritoPor
        - creadoEn
        - semanasGestacion
        - motivosRiesgo
    ControlPrenatalDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        programaId:
          type: string
          format: uuid
        fecha:
          format: date-time
          type: string
        semanasGestacion:
          type: number
          description: Calculadas a partir de la FUM y la fecha del control.
          example: 24
        pesoKg:
          type: string
          format: decimal
          nullable: true
          example: "58.30"
        sistolica:
          type: number
          nullable: true
        diastolica:
          type: number
          nullable: true
        alturaUterinaCm:
          type: string
          format: decimal
          nullable: true
          description: Altura uterina en centimetros.
          example: "24.0"
        fcf:
          type: number
          nullable: true
          description: Frecuencia cardiaca fetal, latidos por minuto.
          example: 140
        edema:
          type: boolean
          nullable: true
        alertas:
          description: Senales de alarma detectadas por el sistema en este control.
          type: array
          items:
            type: string
        proximoControl:
          type: string
          format: date-time
          nullable: true
        registradoPor:
          type: string
          format: uuid
        observaciones:
          type: string
          nullable: true
          description: Descifradas.
      required:
        - id
        - programaId
        - fecha
        - semanasGestacion
        - pesoKg
        - sistolica
        - diastolica
        - alturaUterinaCm
        - fcf
        - edema
        - alertas
        - proximoControl
        - registradoPor
        - observaciones
    RegistrarControlPrenatalDto:
      type: object
      properties:
        pesoKg:
          type: number
          minimum: 30
          maximum: 200
        sistolica:
          type: number
          minimum: 50
          maximum: 300
        diastolica:
          type: number
          minimum: 30
          maximum: 200
        alturaUterinaCm:
          type: number
          minimum: 5
          maximum: 50
          description: Altura uterina en centimetros
        fcf:
          type: number
          minimum: 60
          maximum: 220
          description: Frecuencia cardiaca fetal
        edema:
          type: boolean
        observaciones:
          type: string
        fecha:
          format: date-time
          type: string
    ProgramaEmbarazoBaseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pacienteId:
          type: string
          format: uuid
        comunidadId:
          type: string
          format: uuid
        fum:
          format: date-time
          type: string
          description: Fecha de ultima menstruacion.
        fpp:
          format: date-time
          type: string
          description: "Fecha probable de parto: FUM + 280 dias (regla de Naegele)."
        numeroGestacion:
          type: number
          example: 3
        partosPrevios:
          type: number
          example: 2
        riesgo:
          type: string
          enum: *a9
        motivoRiesgo:
          type: string
          nullable: true
          maxLength: 300
          description: Por que se clasifico como alto riesgo, para que el siguiente turno
            sepa a que atenerse.
        estado:
          type: string
          enum: *a8
        resultado:
          type: string
          enum: *a10
          nullable: true
        fechaCierre:
          type: string
          format: date-time
          nullable: true
        inscritoPor:
          type: string
          format: uuid
        creadoEn:
          format: date-time
          type: string
      required:
        - id
        - pacienteId
        - comunidadId
        - fum
        - fpp
        - numeroGestacion
        - partosPrevios
        - riesgo
        - motivoRiesgo
        - estado
        - resultado
        - fechaCierre
        - inscritoPor
        - creadoEn
    RespuestaErrorDto:
      type: object
      properties:
        codigo:
          type: string
          description: Codigo estable. El cliente decide que hacer segun este valor, no
            segun el mensaje.
          enum:
            - VALIDACION
            - NO_AUTENTICADO
            - SIN_PERMISO
            - NO_ENCONTRADO
            - CONFLICTO
            - DEMASIADAS_PETICIONES
            - ERROR_INTERNO
          example: VALIDACION
        mensaje:
          type: string
          description: Mensaje en espanol, apto para mostrarse tal cual al usuario.
          example: La informacion enviada no es valida.
        detalles:
          description: Detalle por campo. Presente sobre todo en errores de validacion.
          example:
            - dpi debe tener 13 digitos
          type: array
          items:
            type: string
        trazaId:
          type: string
          description: Identificador de correlacion. Es lo que se busca en los logs para
            esta peticion.
          example: 7f3a1c2e-9b4d-4e21-8a55-0c1d2e3f4a5b
        ruta:
          type: string
          example: /v1/pacientes
        fecha:
          type: string
          format: date-time
          example: 2026-08-26T15:04:05.000Z
      required:
        - codigo
        - mensaje
        - trazaId
        - ruta
        - fecha
