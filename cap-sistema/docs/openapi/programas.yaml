openapi: 3.0.0
paths:
  /v1/salud:
    get:
      operationId: SaludController_vivo
      parameters: []
      responses:
        "200":
          description: ""
      summary: El proceso esta vivo
      tags: &a1
        - salud
  /v1/salud/listo:
    get:
      operationId: SaludController_listo
      parameters: []
      responses:
        "200":
          description: ""
      summary: El servicio y sus dependencias responden
      tags: *a1
  /v1/programas/hipertension:
    get:
      operationId: HipertensionController_listar
      parameters:
        - name: estado
          required: true
          in: query
          schema:
            type: string
        - name: comunidadId
          required: true
          in: query
          schema:
            type: string
        - name: pagina
          required: true
          in: query
          schema:
            type: string
        - name: tamano
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: &a2
        - bearer: []
      summary: Inscripciones, con su ultimo control
      tags: &a3
        - programa-hipertension
    post:
      operationId: HipertensionController_inscribir
      parameters:
        - name: authorization
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InscribirHipertensionDto"
      responses:
        "201":
          description: ""
      security: *a2
      summary: Inscribe a un paciente en el programa
      tags: *a3
  /v1/programas/hipertension/atrasados:
    get:
      operationId: HipertensionController_atrasados
      parameters:
        - name: pagina
          required: true
          in: query
          schema:
            type: string
        - name: tamano
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a2
      summary: Pacientes que ya pasaron su fecha de proximo control
      tags: *a3
  /v1/programas/hipertension/{id}:
    get:
      operationId: HipertensionController_obtener
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a2
      tags: *a3
  /v1/programas/hipertension/{id}/controles:
    get:
      operationId: HipertensionController_listarControles
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: pagina
          required: true
          in: query
          schema:
            type: string
        - name: tamano
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a2
      tags: *a3
    post:
      description: La clasificacion y la fecha del proximo control las calcula el
        sistema; no se teclean.
      operationId: HipertensionController_registrarControl
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarControlHipertensionDto"
      responses:
        "201":
          description: ""
      security: *a2
      summary: Registra un control
      tags: *a3
  /v1/programas/hipertension/{id}/egreso:
    patch:
      operationId: HipertensionController_egresar
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a2
      summary: Cierra la inscripcion en el programa
      tags: *a3
  /v1/programas/embarazo:
    get:
      operationId: EmbarazoController_listar
      parameters:
        - name: estado
          required: true
          in: query
          schema:
            type: string
        - name: riesgo
          required: true
          in: query
          schema:
            type: string
        - name: comunidadId
          required: true
          in: query
          schema:
            type: string
        - name: pagina
          required: true
          in: query
          schema:
            type: string
        - name: tamano
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: &a4
        - bearer: []
      summary: Seguimientos, ordenados por fecha probable de parto
      tags: &a5
        - programa-embarazo
    post:
      description: La FPP y la clasificacion de riesgo las calcula el sistema a partir
        de la FUM.
      operationId: EmbarazoController_inscribir
      parameters:
        - name: authorization
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InscribirEmbarazoDto"
      responses:
        "201":
          description: ""
      security: *a4
      summary: Inscribe un embarazo
      tags: *a5
  /v1/programas/embarazo/alto-riesgo:
    get:
      operationId: EmbarazoController_altoRiesgo
      parameters:
        - name: pagina
          required: true
          in: query
          schema:
            type: string
        - name: tamano
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a4
      summary: Embarazos activos clasificados como de alto riesgo
      tags: *a5
  /v1/programas/embarazo/{id}:
    get:
      operationId: EmbarazoController_obtener
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a4
      tags: *a5
  /v1/programas/embarazo/{id}/controles:
    get:
      operationId: EmbarazoController_listarControles
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: pagina
          required: true
          in: query
          schema:
            type: string
        - name: tamano
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a4
      tags: *a5
    post:
      description: Las semanas de gestacion, las senales de alarma y la fecha del
        proximo control las calcula el sistema.
      operationId: EmbarazoController_registrarControl
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarControlPrenatalDto"
      responses:
        "201":
          description: ""
      security: *a4
      summary: Registra un control prenatal
      tags: *a5
  /v1/programas/embarazo/{id}/cierre:
    patch:
      operationId: EmbarazoController_cerrar
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a4
      summary: Cierra el seguimiento con su resultado
      tags: *a5
info:
  title: Servicio programas - CAP Purulha
  description: >-
    Contrato del servicio programas.


    Generado desde el codigo. No editar a mano: los cambios se pierden en la
    siguiente exportacion. Fuente de verdad: arquitectura-cap-purulha.md
  version: "1.0"
  contact: {}
tags: []
servers:
  - url: http://localhost:3003
    description: Desarrollo local
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    InscribirHipertensionDto:
      type: object
      properties:
        pacienteId:
          type: string
          description: Identificador del paciente en el servicio de usuarios
        metaSistolica:
          type: number
          default: 140
          description: Meta de presion sistolica acordada
        metaDiastolica:
          type: number
          default: 90
      required:
        - pacienteId
    RegistrarControlHipertensionDto:
      type: object
      properties:
        sistolica:
          type: number
          example: 148
          minimum: 50
          maximum: 300
        diastolica:
          type: number
          example: 94
          minimum: 30
          maximum: 200
        pesoKg:
          type: number
          minimum: 20
          maximum: 400
        adherencia:
          type: boolean
          description: Si el paciente refiere estar tomando el tratamiento
        observaciones:
          type: string
        fecha:
          format: date-time
          type: string
          description: Fecha real del control. Se usa al digitalizar papel.
      required:
        - sistolica
        - diastolica
    InscribirEmbarazoDto:
      type: object
      properties:
        pacienteId:
          type: string
        fum:
          format: date-time
          type: string
          example: 2026-01-15
          description: Fecha de ultima menstruacion. De aqui salen la FPP y las semanas de
            gestacion.
        numeroGestacion:
          type: number
          default: 1
          minimum: 1
        partosPrevios:
          type: number
          default: 0
      required:
        - pacienteId
        - fum
    RegistrarControlPrenatalDto:
      type: object
      properties:
        pesoKg:
          type: number
          minimum: 30
          maximum: 200
        sistolica:
          type: number
          minimum: 50
          maximum: 300
        diastolica:
          type: number
          minimum: 30
          maximum: 200
        alturaUterinaCm:
          type: number
          minimum: 5
          maximum: 50
          description: Altura uterina en centimetros
        fcf:
          type: number
          minimum: 60
          maximum: 220
          description: Frecuencia cardiaca fetal
        edema:
          type: boolean
        observaciones:
          type: string
        fecha:
          format: date-time
          type: string
