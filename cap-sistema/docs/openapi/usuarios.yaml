          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "401":
          description: Falta el token, expiro o no es valido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "403":
          description: El rol de la cuenta no tiene permiso sobre este recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "404":
          description: El recurso solicitado no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      security: *a12
      summary: Registra una ficha clinica completa
      tags: *a13
  /v1/fichas/{id}:
    get:
      description: El IMC viene calculado de peso y talla; no se guarda en la base.
      operationId: FichasController_obtener
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FichaDto"
        "400":
          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "401":
          description: Falta el token, expiro o no es valido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "403":
          description: El rol de la cuenta no tiene permiso sobre este recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "404":
          description: El recurso solicitado no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      security: *a12
      summary: Una ficha registrada, con el texto descifrado y el catalogo resuelto
      tags: *a13
info:
  title: Servicio usuarios - CAP Purulha
  description: >-
    Contrato del servicio usuarios.


    Generado desde el codigo. No editar a mano: los cambios se pierden en la
    siguiente exportacion. Fuente de verdad: arquitectura-cap-purulha.md
  version: "1.0"
  contact: {}
tags: []
servers:
  - url: http://localhost:3002
    description: Desarrollo local
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SaludVivoDto:
      type: object
      properties:
        estado:
          type: string
          enum:
            - vivo
          example: vivo
        fecha:
          type: string
          format: date-time
      required:
        - estado
        - fecha
    SaludListoDto:
      type: object
      properties:
        estado:
          type: string
          enum:
            - listo
          example: listo
        baseDatos:
          type: string
          description: "'ok' cuando la base responde. Si no, el endpoint devuelve 503 en
            vez de este cuerpo."
          example: ok
      required:
        - estado
        - baseDatos
    ComunidadDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Purulha Centro
        codigo:
          type: string
          nullable: true
          description: Codigo interno del CAP, si lo tiene.
        distante:
          type: boolean
          description: "Comunidad lejana al CAP. Cambia la prioridad de seguimiento: a
            quien vive lejos no se le cita por gusto."
        activa:
          type: boolean
          description: Una comunidad inactiva ya no aparece al registrar pacientes.
      required:
        - id
        - nombre
        - distante
        - activa
    CrearComunidadDto:
      type: object
      properties:
        nombre:
          type: string
          example: Chilasco
        codigo:
          type: string
          example: CHI-01
        distante:
          type: boolean
          description: Comunidad de dificil acceso. Se usa para priorizar visitas y
            seguimiento.
      required:
        - nombre
    PaginaDto:
      type: object
      properties:
        pagina:
          type: number
          description: Pagina devuelta, empezando en 1.
          example: 1
        tamano:
          type: number
          description: Registros por pagina. El servidor recorta cualquier valor mayor al
            maximo.
          maximum: 100
          example: 25
        total:
          type: number
          description: Total de registros que cumplen el filtro.
          example: 137
        totalPaginas:
          type: number
          description: Total de paginas. Nunca es menor que 1.
          example: 6
      required:
        - pagina
        - tamano
        - total
        - totalPaginas
    ComunidadResumenDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Purulha Centro
      required:
        - id
        - nombre
    ExpedienteResumenDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          description: Descifrado al vuelo. En la base vive cifrado.
          example: EXP-2026-000123
      required:
        - id
        - numero
    PacienteResumenDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombres:
          type: string
        apellidos:
          type: string
        fechaNacimiento:
          format: date-time
          type: string
        edad:
          type: number
          description: Calculada al momento de responder.
          example: 34
        sexo:
          type: string
          example: F
        idioma:
          type: string
          description: Idioma de atencion. En Purulha buena parte del padron habla q eqchi.
          example: ES
        fallecido:
          type: boolean
        comunidad:
          $ref: "#/components/schemas/ComunidadResumenDto"
        expediente:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/ExpedienteResumenDto"
      required:
        - id
        - nombres
        - apellidos
        - fechaNacimiento
        - edad
        - sexo
        - idioma
        - fallecido
        - comunidad
        - expediente
    GrupoResumenDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: GF-2026-000045
      required:
        - id
        - codigo
    ExpedienteDePacienteDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          description: Descifrado al vuelo. En la base vive cifrado.
          example: EXP-2026-000123
        aperturaEn:
          type: string
          format: date-time
          nullable: true
          description: "Apertura del expediente EN PAPEL, que puede ser muy anterior a la
            digitalizacion. null cuando no se conoce: los expedientes viejos no
            siempre la traen."
      required:
        - id
        - numero
        - aperturaEn
    PacienteDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dpi:
          type: string
          nullable: true
          description: null cuando el paciente no tiene DPI registrado.
        nombres:
          type: string
        apellidos:
          type: string
        fechaNacimiento:
          format: date-time
          type: string
        edad:
          type: number
          example: 34
        sexo:
          type: string
          example: F
        idioma:
          type: string
          example: ES
        telefono:
          type: string
          nullable: true
        fallecido:
          type: boolean
        comunidad:
          $ref: "#/components/schemas/ComunidadResumenDto"
        grupoFamiliar:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/GrupoResumenDto"
        expediente:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/ExpedienteDePacienteDto"
      required:
        - id
        - dpi
        - nombres
        - apellidos
        - fechaNacimiento
        - edad
        - sexo
        - idioma
        - telefono
        - fallecido
        - comunidad
        - grupoFamiliar
        - expediente
    CrearPacienteDto:
      type: object
      properties:
        dpi:
          type: string
          example: "1234567890101"
          description: "DPI de 13 digitos. OPCIONAL: los ninos y parte de la poblacion
            rural no lo tienen."
        nombres:
          type: string
          example: Juana Isabel
        apellidos:
          type: string
          example: Perez Caal
        fechaNacimiento:
          format: date-time
          type: string
          example: 1985-04-12
        sexo:
          type: string
          enum:
            - M
            - F
        idioma:
          type: string
          enum:
            - ESPANOL
            - POQOMCHI
            - QEQCHI
            - OTRO
          default: ESPANOL
        comunidadId:
          type: string
          description: Identificador de la comunidad
        grupoFamiliarId:
          type: string
        telefono:
          type: string
        numeroExpediente:
          type: string
          description: Numero del expediente de papel. Se usa al digitalizar; si se omite,
            el sistema genera uno.
        digitalizado:
          type: boolean
          description: Marca el expediente como proveniente de papel (RF-08).
      required:
        - nombres
        - apellidos
        - fechaNacimiento
        - sexo
        - comunidadId
    PacienteCreadoDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numeroExpediente:
          type: string
          example: EXP-2026-000123
        expedienteId:
          type: string
          format: uuid
      required:
        - id
        - numeroExpediente
        - expedienteId
    ActualizarPacienteDto:
      type: object
      properties:
        nombres:
          type: string
        apellidos:
          type: string
        idioma:
          type: string
          enum:
            - ESPANOL
            - POQOMCHI
            - QEQCHI
            - OTRO
        comunidadId:
          type: string
        grupoFamiliarId:
          type: string
        telefono:
          type: string
        fallecido:
          type: boolean
    GrupoFamiliarResumenDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: GF-2026-000045
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        comunidad:
          $ref: "#/components/schemas/ComunidadResumenDto"
        integrantes:
          type: number
          description: "Contado en la base de datos, no trayendo a los integrantes: evita
            el N+1 de esta pantalla."
          example: 5
      required:
        - id
        - codigo
        - direccion
        - telefono
        - comunidad
        - integrantes
    IntegranteDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombres:
          type: string
        apellidos:
          type: string
        fechaNacimiento:
          format: date-time
          type: string
        sexo:
          type: string
          example: M
        fallecido:
          type: boolean
        edad:
          type: number
          example: 12
      required:
        - id
        - nombres
        - apellidos
        - fechaNacimiento
        - sexo
        - fallecido
        - edad
    GrupoFamiliarDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: GF-2026-000045
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        comunidad:
          $ref: "#/components/schemas/ComunidadResumenDto"
        integrantes:
          description: Ordenados del mayor al menor.
          type: array
          items:
            $ref: "#/components/schemas/IntegranteDto"
      required:
        - id
        - codigo
        - direccion
        - telefono
        - comunidad
        - integrantes
    CrearGrupoDto:
      type: object
      properties:
        codigo:
          type: string
          description: Codigo del grupo familiar segun el registro del CAP. Si se omite,
            el sistema genera uno.
        comunidadId:
          type: string
        direccion:
          type: string
          example: Caserio El Rejon, casa 14
        telefono:
          type: string
      required:
        - comunidadId
    GrupoFamiliarCreadoDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: GF-2026-000045
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        comunidadId:
          type: string
          format: uuid
      required:
        - id
        - codigo
        - direccion
        - telefono
        - comunidadId
    PacienteDelExpedienteDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombres:
          type: string
        apellidos:
          type: string
        fechaNacimiento:
          format: date-time
          type: string
        sexo:
          type: string
          example: F
        comunidad:
          $ref: "#/components/schemas/ComunidadResumenDto"
      required:
        - id
        - nombres
        - apellidos
        - fechaNacimiento
        - sexo
        - comunidad
    DigitalizacionDelExpedienteDto:
      type: object
      properties:
        estado:
          type: string
          enum:
            - PENDIENTE
            - EN_PROCESO
            - COMPLETO
            - NO_LOCALIZADO
        digitalizadoPor:
          type: string
          nullable: true
        iniciadoEn:
          type: string
          format: date-time
          nullable: true
        completadoEn:
          type: string
          format: date-time
          nullable: true
        atencionesTranscritas:
          type: number
          description: Cuantas atenciones del papel se transcribieron.
        observaciones:
          type: string
          nullable: true
      required:
        - estado
        - digitalizadoPor
        - iniciadoEn
        - completadoEn
        - atencionesTranscritas
        - observaciones
    ExpedienteEncontradoDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          example: EXP-2026-000123
        aperturaEn:
          type: string
          format: date-time
          nullable: true
          description: Apertura del expediente en papel. null cuando no se conoce.
        paciente:
          $ref: "#/components/schemas/PacienteDelExpedienteDto"
        digitalizacion:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/DigitalizacionDelExpedienteDto"
      required:
        - id
        - numero
        - aperturaEn
        - paciente
        - digitalizacion
    AtencionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fecha:
          format: date-time
          type: string
        registradaPor:
          type: string
          format: uuid
          description: Usuario del sistema que la registro.
        digitalizada:
          type: boolean
          description: true si proviene de transcribir una atencion en papel.
        motivo:
          type: string
          nullable: true
          description: Descifrado. En la base es ilegible.
        diagnostico:
          type: string
          nullable: true
        tratamiento:
          type: string
          nullable: true
        notas:
          type: string
          nullable: true
        pesoKg:
          type: string
          format: decimal
          nullable: true
          example: "72.5"
        tallaCm:
          type: string
          format: decimal
          nullable: true
          example: "158.0"
        presionSistolica:
          type: number
          nullable: true
          example: 148
        presionDiastolica:
          type: number
          nullable: true
          example: 94
        temperaturaC:
          type: string
          format: decimal
          nullable: true
          example: "37.2"
      required:
        - id
        - fecha
        - registradaPor
        - digitalizada
        - motivo
        - diagnostico
        - tratamiento
        - notas
        - pesoKg
        - tallaCm
        - presionSistolica
        - presionDiastolica
        - temperaturaC
    RegistrarAtencionDto:
      type: object
      properties:
        motivo:
          type: string
          example: Control de presion arterial
        diagnostico:
          type: string
        tratamiento:
          type: string
        notas:
          type: string
        pesoKg:
          type: number
          minimum: 0.5
          maximum: 400
        tallaCm:
          type: number
          minimum: 20
          maximum: 250
        presionSistolica:
          type: number
          minimum: 50
          maximum: 300
        presionDiastolica:
          type: number
          minimum: 30
          maximum: 200
        temperaturaC:
          type: number
          minimum: 30
          maximum: 45
        fecha:
          format: date-time
          type: string
          description: "Fecha real de la atencion. Se usa al digitalizar papel: la
            consulta ocurrio hace anos."
        digitalizada:
          type: boolean
          description: Marca la atencion como transcrita desde papel.
      required:
        - motivo
    ConteoPorEstadoDto:
      type: object
      properties:
        PENDIENTE:
          type: number
          example: 1240
        EN_PROCESO:
          type: number
          example: 85
        COMPLETO:
          type: number
          example: 613
        NO_LOCALIZADO:
          type: number
          description: Expedientes que el personal no encontro en el archivo fisico.
          example: 12
      required:
        - PENDIENTE
        - EN_PROCESO
        - COMPLETO
        - NO_LOCALIZADO
    ResumenDigitalizacionDto:
      type: object
      properties:
        total:
          type: number
          example: 1950
        porEstado:
          $ref: "#/components/schemas/ConteoPorEstadoDto"
        porcentajeCompleto:
          type: number
          description: Con un decimal. 0 cuando todavia no hay expedientes.
          example: 31.4
      required:
        - total
        - porEstado
        - porcentajeCompleto
    ActualizarDigitalizacionDto:
      type: object
      properties:
        estado:
          type: string
          enum:
            - PENDIENTE
            - EN_PROCESO
            - COMPLETO
            - NO_LOCALIZADO
        observaciones:
          type: string
      required:
        - estado
    RegistroDigitalizacionDto:
      type: object
      properties:
        expedienteId:
          type: string
          format: uuid
        estado:
          type: string
          enum:
            - PENDIENTE
            - EN_PROCESO
            - COMPLETO
            - NO_LOCALIZADO
        digitalizadoPor:
          type: string
          nullable: true
        iniciadoEn:
          type: string
          format: date-time
          nullable: true
        completadoEn:
          type: string
          format: date-time
          nullable: true
        atencionesTranscritas:
          type: number
          example: 7
        observaciones:
          type: string
          nullable: true
          maxLength: 500
      required:
        - expedienteId
        - estado
        - digitalizadoPor
        - iniciadoEn
        - completadoEn
        - atencionesTranscritas
        - observaciones
    SignoPeligroCatalogoDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orden:
          type: number
          description: Orden en que aparece en el formulario impreso.
        texto:
          type: string
          description: Texto tal cual esta impreso en el papel.
        pideTexto:
          type: boolean
          description: true en "Otros (describir)".
      required:
        - id
        - orden
        - texto
        - pideTexto
    AntecedenteCatalogoDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          description: Identificador estable, citable desde los reportes.
          example: MED_DIABETES
        grupo:
          type: string
          enum:
            - MEDICO
            - FAMILIAR
            - HABITO
        orden:
          type: number
        texto:
          type: string
          example: Hipertensión arterial
        pideDetalle:
          type: boolean
          description: Pide escribir "cual".
        pideFecha:
          type: boolean
          description: Pide la fecha de la ultima vez.
        pideNumero:
          type: boolean
          description: "Pide una cantidad: dosis, cigarrillos al dia."
        permiteNoAplica:
          type: boolean
          description: El papel ofrece "No aplica" ademas de SI y NO.
      required:
        - id
        - codigo
        - grupo
        - orden
        - texto
        - pideDetalle
        - pideFecha
        - pideNumero
        - permiteNoAplica
    OpcionCatalogoDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orden:
          type: number
          description: Orden en que aparece en el formulario impreso.
        texto:
          type: string
          description: Texto tal cual esta impreso en el papel.
      required:
        - id
        - orden
        - texto
    DiagnosticoCatalogoDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orden:
          type: number
          description: Orden en que aparece en el formulario impreso.
        texto:
          type: string
          description: Texto tal cual esta impreso en el papel.
        pideTexto:
          type: boolean
          description: 'true en las opciones "Otro: ____", que piden escribir cual.'
      required:
        - id
        - orden
        - texto
        - pideTexto
    ProblemaCatalogoDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orden:
          type: number
        nombre:
          type: string
          example: Tos o dificultad para respirar
        signos:
          description: Lo que en el papel se subraya en EVALUAR.
          type: array
          items:
            $ref: "#/components/schemas/OpcionCatalogoDto"
        diagnosticos:
          description: Lo que se subraya en CLASIFICAR.
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticoCatalogoDto"
      required:
        - id
        - orden
        - nombre
        - signos
        - diagnosticos
    CatalogoFichaDto:
      type: object
      properties:
        tipoFicha:
          type: string
          enum: &a14
            - ADULTO
            - NEONATO
            - NINEZ
            - PRENATAL
        signosPeligro:
          type: array
          items:
            $ref: "#/components/schemas/SignoPeligroCatalogoDto"
        antecedentes:
          type: array
          items:
            $ref: "#/components/schemas/AntecedenteCatalogoDto"
        problemas:
          type: array
          items:
            $ref: "#/components/schemas/ProblemaCatalogoDto"
      required:
        - tipoFicha
        - signosPeligro
        - antecedentes
        - problemas
    SignoPeligroEvaluadoDto:
      type: object
      properties:
        signoId:
          type: string
          format: uuid
        presente:
          type: boolean
        detalle:
          type: string
          description: Solo en el signo "Otros (describir)".
      required:
        - signoId
        - presente
    ProblemaEvaluadoDto:
      type: object
      properties:
