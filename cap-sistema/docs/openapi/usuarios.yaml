  /v1/digitalizacion/cola:
    get:
      description: "Sin filtro de estado devuelve lo que falta: pendientes y en
        proceso. El orden es por apellido, que es como estan las carpetas en el
        archivo."
      operationId: DigitalizacionController_cola
      parameters:
        - name: comunidadId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: estado
          required: false
          in: query
          description: "Por defecto, los que faltan: pendientes y en proceso."
          schema:
            enum:
              - PENDIENTE
              - EN_PROCESO
              - COMPLETO
              - NO_LOCALIZADO
            type: string
        - name: pagina
          required: false
          in: query
          description: Empieza en 1. Por defecto 1.
          schema:
            default: 1
            example: 1
            type: number
        - name: tamano
          required: false
          in: query
          description: Por defecto 25. El servidor recorta cualquier valor mayor a 100.
          schema:
            maximum: 100
            default: 25
            example: 25
            type: number
      responses:
        "200":
          description: La cola. NO incluye DPI ni telefono.
