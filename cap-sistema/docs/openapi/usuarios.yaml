info:
  title: Servicio usuarios - CAP Purulha
  description: >-
    Contrato del servicio usuarios.


    Generado desde el codigo. No editar a mano: los cambios se pierden en la
    siguiente exportacion. Fuente de verdad: arquitectura-cap-purulha.md
  version: "1.0"
  contact: {}
tags: []
servers:
  - url: http://localhost:3002
    description: Desarrollo local
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SaludVivoDto:
      type: object
      properties:
        estado:
          type: string
          enum:
            - vivo
          example: vivo
        fecha:
          type: string
          format: date-time
      required:
        - estado
        - fecha
    SaludListoDto:
      type: object
      properties:
        estado:
          type: string
          enum:
            - listo
          example: listo
        baseDatos:
          type: string
          description: "'ok' cuando la base responde. Si no, el endpoint devuelve 503 en
            vez de este cuerpo."
          example: ok
      required:
        - estado
        - baseDatos
    ComunidadDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Purulha Centro
        codigo:
          type: string
          nullable: true
          description: Codigo interno del CAP, si lo tiene.
        distante:
          type: boolean
          description: "Comunidad lejana al CAP. Cambia la prioridad de seguimiento: a
            quien vive lejos no se le cita por gusto."
        activa:
          type: boolean
          description: Una comunidad inactiva ya no aparece al registrar pacientes.
      required:
        - id
        - nombre
        - distante
        - activa
    LugarResumenDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Barrio El Centro
        tipo:
          type: string
          enum:
            - BARRIO
            - CASERIO
            - ALDEA
            - OTRO
      required:
        - id
        - nombre
        - tipo
    CrearComunidadDto:
      type: object
      properties:
        nombre:
          type: string
          example: Chilasco
        codigo:
          type: string
          example: CHI-01
        distante:
          type: boolean
          description: Comunidad de dificil acceso. Se usa para priorizar visitas y
            seguimiento.
      required:
        - nombre
    PaginaDto:
      type: object
      properties:
        pagina:
          type: number
          description: Pagina devuelta, empezando en 1.
          example: 1
        tamano:
          type: number
          description: Registros por pagina. El servidor recorta cualquier valor mayor al
            maximo.
          maximum: 100
          example: 25
        total:
          type: number
          description: Total de registros que cumplen el filtro.
          example: 137
        totalPaginas:
          type: number
          description: Total de paginas. Nunca es menor que 1.
          example: 6
