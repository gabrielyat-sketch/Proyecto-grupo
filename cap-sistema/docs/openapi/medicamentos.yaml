info:
  title: Servicio medicamentos - CAP Purulha
  description: >-
    Contrato del servicio medicamentos.


    Generado desde el codigo. No editar a mano: los cambios se pierden en la
    siguiente exportacion. Fuente de verdad: arquitectura-cap-purulha.md
  version: "1.0"
  contact: {}
tags: []
servers:
  - url: http://localhost:3004
    description: Desarrollo local
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SaludVivoDto:
      type: object
      properties:
        estado:
          type: string
          enum:
            - vivo
          example: vivo
        fecha:
          type: string
          format: date-time
      required:
        - estado
        - fecha
    SaludListoDto:
      type: object
      properties:
        estado:
          type: string
          enum:
            - listo
          example: listo
        baseDatos:
          type: string
          description: "'ok' cuando la base responde. Si no, el endpoint devuelve 503 en
            vez de este cuerpo."
          example: ok
      required:
        - estado
        - baseDatos
    PaginaDto:
      type: object
      properties:
        pagina:
          type: number
          description: Pagina devuelta, empezando en 1.
          example: 1
        tamano:
          type: number
          description: Registros por pagina. El servidor recorta cualquier valor mayor al
            maximo.
          maximum: 100
          example: 25
        total:
          type: number
          description: Total de registros que cumplen el filtro.
          example: 137
        totalPaginas:
          type: number
          description: Total de paginas. Nunca es menor que 1.
          example: 6
      required:
        - pagina
        - tamano
        - total
        - totalPaginas
    MedicamentoConExistenciaDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: AMOX500
        nombreGenerico:
          type: string
        nombreComercial:
          type: string
          nullable: true
        presentacion:
          type: string
          nullable: true
        concentracion:
          type: string
          nullable: true
        unidad:
          type: string
          enum: &a8
            - TABLETA
            - CAPSULA
            - JARABE_ML
            - AMPOLLA
            - FRASCO
            - SOBRE
            - UNIDAD
            - GRAMO
        requiereReceta:
          type: boolean
        activo:
          type: boolean
        stockMinimo:
          type: number
          example: 50
        existencia:
          type: number
          description: Suma de los lotes DISPONIBLES.
          example: 320
        bajoMinimo:
