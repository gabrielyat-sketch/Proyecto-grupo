openapi: 3.0.0
paths:
  /v1/salud:
    get:
      operationId: SaludController_vivo
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaludVivoDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      summary: El proceso esta vivo
