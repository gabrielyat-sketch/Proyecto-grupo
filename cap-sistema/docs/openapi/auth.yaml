openapi: 3.0.0
paths:
  /v1/salud:
    get:
      operationId: SaludController_vivo
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaludVivoDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      summary: El proceso esta vivo
      tags: &a1
        - salud
  /v1/salud/listo:
    get:
      operationId: SaludController_listo
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaludListoDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "503":
          description: La base de datos no responde. El gateway debe dejar de enviar
            trafico a esta instancia.
      summary: El servicio y sus dependencias responden
      tags: *a1
  /v1/auth/login:
    post:
      description: Devuelve los tokens, o mfaRequerido=true con un token parcial si el
        rol exige segundo factor.
      operationId: AutenticacionController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Sesion abierta, o segundo factor pendiente.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SesionAbiertaDto"
                  - $ref: "#/components/schemas/MfaRequeridoDto"
        "400":
          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      summary: Inicia sesion
      tags: &a2
        - autenticacion
  /v1/auth/mfa/verificar:
    post:
      operationId: AutenticacionController_verificarMfa
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificarMfaDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionAbiertaDto"
        "400":
          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      summary: Completa el login con el codigo de segundo factor
      tags: *a2
  /v1/auth/refrescar:
    post:
      operationId: AutenticacionController_refrescar
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefrescarDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefrescoDto"
        "400":
          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      summary: Rota el token de refresco y emite uno de acceso nuevo
      tags: *a2
  /v1/auth/cerrar-sesion:
    post:
      operationId: AutenticacionController_cerrarSesion
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefrescarDto"
      responses:
        "204":
          description: Sesion revocada.
        "400":
          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      summary: Revoca la sesion indicada
      tags: *a2
  /v1/auth/mfa/configurar-inicial:
    post:
      description: "Para cuentas cuyo rol exige MFA y que aun no lo configuraron. Se
        autoriza con el token parcial del login, no con un token de acceso: sin
        esto la cuenta inicial del sistema no podria entrar nunca. Devuelve el
        QR, el secreto y los codigos de respaldo. El segundo factor queda
        INACTIVO hasta confirmarlo en mfa/activar-inicial."
      operationId: AutenticacionController_configurarMfaInicial
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigurarMfaInicialDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguracionMfaDto"
        "400":
          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "409":
          description: La cuenta ya tiene el segundo factor configurado. Use mfa/verificar.
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      summary: Configura el segundo factor por primera vez, sin sesion previa
      tags: *a2
  /v1/auth/mfa/activar-inicial:
    post:
      description: "Devuelve los tokens directamente: a estas alturas la persona ya
        demostro contrasena correcta y control de su aplicacion de
        autenticacion."
      operationId: AutenticacionController_activarMfaInicial
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificarMfaDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionAbiertaDto"
        "400":
          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "409":
          description: La cuenta ya tiene el segundo factor configurado. Use mfa/verificar.
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      summary: Confirma la primera configuracion y abre la sesion
      tags: *a2
  /v1/auth/yo:
    get:
      operationId: AutenticacionController_yo
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilPropioDto"
        "401":
          description: Falta el token, expiro o no es valido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "403":
          description: El rol de la cuenta no tiene permiso sobre este recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      security:
        - bearer: []
      summary: Perfil del usuario autenticado
      tags: *a2
  /v1/auth/contrasena:
    post:
      operationId: AutenticacionController_cambiarContrasena
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambiarContrasenaDto"
      responses:
        "204":
          description: Contrasena actualizada.
        "400":
          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "401":
          description: Falta el token, expiro o no es valido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "403":
          description: El rol de la cuenta no tiene permiso sobre este recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      security:
        - bearer: []
      summary: Cambia la propia contrasena
      tags: *a2
  /v1/auth/mfa/configurar:
    post:
      description: El segundo factor queda INACTIVO hasta confirmarlo en mfa/activar.
      operationId: AutenticacionController_configurarMfa
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguracionMfaDto"
        "401":
          description: Falta el token, expiro o no es valido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "403":
          description: El rol de la cuenta no tiene permiso sobre este recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      security:
        - bearer: []
      summary: Genera el secreto TOTP y los codigos de respaldo
      tags: *a2
  /v1/auth/mfa/activar:
    post:
      operationId: AutenticacionController_activarMfa
      parameters: []
      responses:
        "204":
          description: Segundo factor activado.
        "401":
          description: Falta el token, expiro o no es valido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "403":
          description: El rol de la cuenta no tiene permiso sobre este recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      security:
        - bearer: []
      summary: Confirma con un codigo real y activa el segundo factor
      tags: *a2
  /v1/usuarios:
    get:
      operationId: UsuariosController_listar
      parameters:
        - name: pagina
          required: false
          in: query
          schema:
            default: 1
            type: number
        - name: tamano
          required: false
          in: query
          schema:
            maximum: 100
            default: 25
            type: number
        - name: rol
          required: false
          in: query
          schema:
            type: string
            enum:
              - ADMINISTRADOR
              - DIRECTOR
              - MEDICO
              - ENFERMERIA
              - FARMACIA
              - RECEPCION
        - name: buscar
          required: false
          in: query
          description: Busca en usuario, nombres y apellidos
          schema:
            type: string
      responses:
        "200":
          description: Listado paginado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginaDto"
                  - type: object
                    required:
                      - datos
                    properties:
                      datos:
                        type: array
                        items:
                          $ref: "#/components/schemas/CuentaDto"
        "400":
          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "401":
          description: Falta el token, expiro o no es valido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "403":
          description: El rol de la cuenta no tiene permiso sobre este recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      security: &a3
        - bearer: []
      summary: Lista paginada de cuentas
      tags: &a4
        - usuarios
    post:
      description: "Devuelve una contrasena temporal. Es la unica vez que se muestra:
        anotela y entreguela a la persona."
      operationId: UsuariosController_crear
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearUsuarioDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuentaCreadaDto"
        "400":
          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "401":
          description: Falta el token, expiro o no es valido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "403":
          description: El rol de la cuenta no tiene permiso sobre este recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      security: *a3
      summary: Crea una cuenta
      tags: *a4
  /v1/usuarios/{id}:
    get:
      operationId: UsuariosController_obtener
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuentaDto"
        "400":
          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "401":
          description: Falta el token, expiro o no es valido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "403":
          description: El rol de la cuenta no tiene permiso sobre este recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "404":
          description: El recurso solicitado no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      security: *a3
      summary: Obtiene una cuenta por su identificador
      tags: *a4
    patch:
      operationId: UsuariosController_actualizar
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarUsuarioDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuentaDto"
        "400":
          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "401":
          description: Falta el token, expiro o no es valido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "403":
          description: El rol de la cuenta no tiene permiso sobre este recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "404":
          description: El recurso solicitado no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      security: *a3
      summary: Actualiza datos, rol o estado de una cuenta
      tags: *a4
  /v1/usuarios/{id}/restablecer-contrasena:
    post:
      operationId: UsuariosController_restablecer
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContrasenaRestablecidaDto"
        "400":
          description: La informacion enviada no es valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "401":
          description: Falta el token, expiro o no es valido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "403":
          description: El rol de la cuenta no tiene permiso sobre este recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "404":
          description: El recurso solicitado no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
        "500":
          description: Error inesperado. El mensaje real queda en los logs, no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaErrorDto"
      security: *a3
      summary: Genera una contrasena temporal nueva y cierra las sesiones
      tags: *a4
info:
  title: Servicio auth - CAP Purulha
  description: >-
    Contrato del servicio auth.


    Generado desde el codigo. No editar a mano: los cambios se pierden en la
    siguiente exportacion. Fuente de verdad: arquitectura-cap-purulha.md
  version: "1.0"
  contact: {}
tags: []
servers:
  - url: http://localhost:3001
    description: Desarrollo local
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SaludVivoDto:
      type: object
      properties:
        estado:
          type: string
          enum:
            - vivo
          example: vivo
        fecha:
          type: string
          format: date-time
      required:
        - estado
        - fecha
    SaludListoDto:
      type: object
      properties:
        estado:
          type: string
          enum:
            - listo
          example: listo
        baseDatos:
          type: string
          description: "'ok' cuando la base responde. Si no, el endpoint devuelve 503 en
            vez de este cuerpo."
          example: ok
      required:
        - estado
        - baseDatos
    Rol:
      type: string
      enum:
        - ADMINISTRADOR
        - DIRECTOR
        - MEDICO
        - ENFERMERIA
        - FARMACIA
        - RECEPCION
    PerfilDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usuario:
          type: string
          description: Nombre de usuario, siempre en minusculas.
          example: jlopez
        rol:
          allOf:
            - $ref: "#/components/schemas/Rol"
        debeCambiarContrasena:
          type: boolean
          description: Si es true, el panel debe obligar al cambio antes de dejar trabajar.
          example: false
      required:
        - id
        - usuario
        - rol
        - debeCambiarContrasena
    SesionAbiertaDto:
      type: object
      properties:
        mfaRequerido:
          type: boolean
          enum:
            - false
          description: "Discriminante: false significa que ya hay sesion."
        tokenAcceso:
          type: string
          description: JWT de acceso. Vida corta; se renueva con el token de refresco.
        tokenRefresco:
          type: string
          description: Token de refresco rotatorio. Reutilizarlo revoca toda la sesion.
        usuario:
          $ref: "#/components/schemas/PerfilDto"
      required:
        - mfaRequerido
        - tokenAcceso
        - tokenRefresco
        - usuario
    MfaRequeridoDto:
      type: object
      properties:
        mfaRequerido:
          type: boolean
          enum:
            - true
          description: "Discriminante: true significa que falta el segundo factor."
        configuracionPendiente:
          type: boolean
          description: true cuando la cuenta aun no ha configurado el TOTP y debe hacerlo
            ahora.
        tokenParcial:
          type: string
          description: Token de un solo uso para completar el login. No es un token de
            acceso.
      required:
        - mfaRequerido
        - configuracionPendiente
        - tokenParcial
    LoginDto:
      type: object
      properties:
        usuario:
          type: string
          example: jperez
        contrasena:
          type: string
          example: Clave-Del-Personal-2026
      required:
        - usuario
        - contrasena
    VerificarMfaDto:
      type: object
      properties:
        tokenParcial:
          type: string
          description: Token parcial devuelto por el login
        codigo:
          type: string
          example: "123456"
          description: Codigo TOTP de 6 digitos o codigo de respaldo
      required:
        - tokenParcial
        - codigo
    RefrescarDto:
      type: object
      properties:
        tokenRefresco:
          type: string
      required:
        - tokenRefresco
    RefrescoDto:
      type: object
      properties:
        tokenAcceso:
          type: string
        tokenRefresco:
          type: string
        usuario:
          $ref: "#/components/schemas/PerfilDto"
      required:
        - tokenAcceso
        - tokenRefresco
        - usuario
    ConfigurarMfaInicialDto:
      type: object
      properties:
        tokenParcial:
          type: string
          description: Token parcial devuelto por el login
      required:
        - tokenParcial
    ConfiguracionMfaDto:
      type: object
      properties:
        uri:
          type: string
          description: URI otpauth. El panel la convierte en codigo QR para la app de
            autenticacion.
          example: otpauth://totp/CAP%20Purulha:jlopez?secret=...
        secreto:
          type: string
          description: El mismo secreto en texto, por si hay que escribirlo a mano.
        codigosRespaldo:
          description: Codigos de un solo uso. Es la UNICA vez que se muestran en claro.
          type: array
          items:
            type: string
      required:
        - uri
        - secreto
        - codigosRespaldo
    PerfilPropioDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usuario:
          type: string
          description: Nombre de usuario, siempre en minusculas.
          example: jlopez
        rol:
          allOf:
            - $ref: "#/components/schemas/Rol"
        debeCambiarContrasena:
          type: boolean
          description: Si es true, el panel debe obligar al cambio antes de dejar trabajar.
          example: false
        mfaActivo:
          type: boolean
          description: Segundo factor ya confirmado y en uso.
      required:
        - id
        - usuario
        - rol
        - debeCambiarContrasena
        - mfaActivo
    CambiarContrasenaDto:
      type: object
      properties:
        contrasenaActual:
          type: string
        contrasenaNueva:
          type: string
          minLength: 10
      required:
        - contrasenaActual
        - contrasenaNueva
    PaginaDto:
      type: object
      properties:
        pagina:
          type: number
          description: Pagina devuelta, empezando en 1.
          example: 1
        tamano:
          type: number
          description: Registros por pagina. El servidor recorta cualquier valor mayor al
            maximo.
          maximum: 100
          example: 25
        total:
          type: number
          description: Total de registros que cumplen el filtro.
          example: 137
        totalPaginas:
          type: number
          description: Total de paginas. Nunca es menor que 1.
          example: 6
      required:
        - pagina
        - tamano
        - total
        - totalPaginas
    CuentaDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usuario:
          type: string
          example: jlopez
        nombres:
          type: string
          example: Juana
        apellidos:
          type: string
          example: Lopez Chub
        rol:
          allOf:
            - $ref: "#/components/schemas/Rol"
        activo:
          type: boolean
          description: Una cuenta desactivada no puede iniciar sesion.
        debeCambiarContrasena:
          type: boolean
        ultimoAcceso:
          type: string
          format: date-time
          nullable: true
          description: null si la cuenta nunca ha entrado.
        creadoEn:
          format: date-time
          type: string
      required:
        - id
        - usuario
        - nombres
        - apellidos
        - rol
        - activo
        - debeCambiarContrasena
        - ultimoAcceso
        - creadoEn
    CrearUsuarioDto:
      type: object
      properties:
        usuario:
          type: string
          example: jperez
        nombres:
          type: string
          example: Juana
        apellidos:
          type: string
          example: Perez Caal
        rol:
          type: string
          enum:
            - ADMINISTRADOR
            - DIRECTOR
            - MEDICO
            - ENFERMERIA
            - FARMACIA
            - RECEPCION
      required:
        - usuario
        - nombres
        - apellidos
        - rol
    CuentaCreadaDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usuario:
          type: string
          example: jlopez
        nombres:
          type: string
          example: Juana
        apellidos:
          type: string
          example: Lopez Chub
        rol:
          allOf:
            - $ref: "#/components/schemas/Rol"
        activo:
          type: boolean
          description: Una cuenta desactivada no puede iniciar sesion.
        debeCambiarContrasena:
          type: boolean
        ultimoAcceso:
          type: string
          format: date-time
          nullable: true
          description: null si la cuenta nunca ha entrado.
        creadoEn:
          format: date-time
